# Default client profile. Copy to config/profiles/<client>.yaml, set `extends: default`,
# and override only what differs for that client. Keys ending in `_extra` ADD to the
# parent's list instead of replacing it, e.g.:
#
#   extends: default
#   id_patterns_extra: ['ACME-\d{4}']        # this client's own ID style
#   sheets:
#     'Use Cases': {header_row: 3, id_column: 'Ref'}
#     'Version History': {skip: true}

name: default

# ---------------------------------------------------------------- IDs
# A cell / line start matching one of these is treated as a requirement ID.
id_patterns:
  - '(?=[A-Za-z0-9_\-]*\d)[A-Z][A-Za-z]{0,9}(?:[-_][A-Za-z0-9]{1,8}){1,3}'   # BO-01, BR-EDD-01, FR-GRV-03, NFR-01, UC_01
  - '(?:Step|UC|US|Use Case|Req|REQ|Story|Rule|Objective|Feature)\s?#?\s?\d+(?:\.\d+)*'  # Step 1.1, Use Case 3, UC 7
  - '[A-Z]{1,6}\d{1,4}(?:\.\d+)*'          # UC001, R12, BR3.1
  - '[A-Z]{2,10}\.\d+(?:\.\d+)*'           # REQ.12, BR.3.1
id_column_names: [id, req id, requirement id, rule id, objective id, obj. id, obj id, step id, uc id,
                  use case id, story id, nfr id, fr id, ref, ref id, reference, requirement no, req no]

# ---------------------------------------------------------------- scenarios
# Each pattern finds a scenario mention and must define groups `kind` and `ord` (number or letter).
# The scenario's name is taken from the text that follows the mention. Letter ordinals are
# upper-case only ("Module A"), so ordinary words are not mistaken for scenarios.
scenario_patterns:
  - '\b(?P<kind>scenario|module|use[ -]?case|uc|feature|epic|work[ -]?stream)\s*[-#]?\s*(?P<ord>\d{1,3}|(?-i:[A-H]))\b'
scenario_column_names: [scenario, scenarios, applicable scenario, module, use case, domain,
                        feature area, epic, process area, work stream, workstream]
shared_labels:
  - '^(shared|common|all|both|global|general|cross[- ]?(portal|platform|cutting|module|scenario))\b'
stop_words: [scenario, module, portal, system, systems, student, students, and, the, of, for, to, in,
             management, platform, application, online, digital, university, service, services,
             process, flow, high, level, business, requirements, requirement, primary, specs, spec,
             functional, phase, project, a, an, e, institutional]
scenario_aliases: {}            # e.g. {"Grievance": ["e-Vidhyarthi Mithra", "Complaint Portal"]}
segment_mode: auto              # auto | whole_file (one use case per file) | per_row (each ID'd row = one use case)
keyword_assignment: true        # assign items with no explicit scenario by distinctive keywords

# ---------------------------------------------------------------- documents
brs_markers: [business requirements specification, software requirements specification, functional specification,
              system specification, system & functional specification, '\bBRS\b', '\bSRS\b', '\bFRS\b']
brd_markers: [business requirements document, '\bBRD\b']
doc_id_patterns:
  - '(?:Document|Specification|Spec|Doc)\s*(?:ID|No\.?|Number)\s*[:|]?\s*([A-Z][A-Z0-9]*(?:-[A-Z0-9]+){2,})'
parent_id_patterns:
  - '(?:Parent\s+BRD|Parent\s+Document|Traceable\s+to|Translates|Derived\s+from)\s*[:|]?\s*([A-Z][A-Z0-9]*(?:-[A-Z0-9]+){2,})'

# ---------------------------------------------------------------- cleaning
skip_sheet_patterns: ['(?i)\b(revision|change[ _-]?log|version[ _-]?history|history|cover|sign[ _-]?off|approvals?|toc|table[ _-]of[ _-]contents|instructions?|lookups?|dropdowns?)\b']
skip_hidden_sheets: true
furniture_min_pages: 0.5

# ---------------------------------------------------------------- pipeline (plug-in names, run in order)
cleaners: [skip_sheets, drop_page_furniture, merge_split_tables, group_multirow_records, drop_empty]
scenario_finders: [scenario_column, scenario_heading, scenario_definition_row]
assigner: explicit_then_keyword
conflict_detectors: [same_id_different_content, document_version_mismatch, similar_item_different_numbers, field_length_mismatch]
conflict_similarity_threshold: 0.85

# ---------------------------------------------------------------- per-sheet overrides (regex on sheet name)
sheets: {}
