# Example client profile. Copy this file, rename it (e.g. acme.yaml) and use it with
#   python -m qa_agents preview --usecase <files> --profile acme
# or pick it in the web page's "Client profile" box.
# Only list what differs from config/profiles/default.yaml.

extends: default
name: example_client

# This client writes requirement IDs like "SR/1001"
id_patterns_extra:
  - 'SR/\d{3,5}'

# This client calls its use cases "Capability 1", "Capability 2" ...
# (a pattern must have named groups `kind` and `ord`)
scenario_patterns_extra:
  - '\b(?P<kind>capability)\s*(?P<ord>\d{1,3})\b'

# Same scenario, different names in different documents
scenario_aliases:
  "Loyalty points": ["Rewards", "Points programme"]

# Sheet-specific fixes: sheet name (regex) -> override
sheets:
  'Use Cases':
    header_row: 3          # the header row is row 3
    id_column: Ref
  'Internal Notes':
    skip: true
